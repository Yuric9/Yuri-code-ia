name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && pip install ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q agent tests
      - name: Run tests
        run: pytest -q

  agent-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent runtime
        run: python -m pip install --upgrade pip && pip install ".[agent]"
      - name: Validate OpenHands SDK imports
        run: python -c "from openhands.sdk import Conversation, LLM; from openhands.tools.preset.default import get_default_agent; print('OpenHands SDK OK')"
      - name: Validate agent construction
        env:
          LLM_API_KEY: ci-placeholder-key
          LLM_MODEL: gpt-5.5
        run: |
          python - <<'PY'
          import os
          from pydantic import SecretStr
          from openhands.sdk import LLM
          from openhands.tools.preset.default import get_default_agent

          llm = LLM(
              usage_id="ci-validation",
              model=os.environ["LLM_MODEL"],
              api_key=SecretStr(os.environ["LLM_API_KEY"]),
          )
          agent = get_default_agent(llm=llm, cli_mode=True)
          assert agent is not None
          print("OpenHands agent construction OK")
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
