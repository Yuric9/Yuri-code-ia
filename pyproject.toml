[project]
name = "yuri-code-ai"
version = "0.4.1"
description = "Agente de IA para programação"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.0",
  "python-dotenv>=1.0",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "tavily-python>=0.5",
]

[project.optional-dependencies]
agent = [
  "openhands-sdk==1.49.4",
  "openhands-tools==1.49.4",
  "openhands-workspace==1.49.4",
]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[project.scripts]
yuri-code-ai = "agent.main:main"
yuri-code-ai-api = "agent.api:start_api"
